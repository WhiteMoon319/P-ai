[package]
edition = "2021"
rust-version = "1.77.2"
name = "tauri-plugin-workspace-io"
version = "0.1.0"
authors = ["WhiteMoon319"]
build = "build.rs"
links = "tauri-plugin-workspace-io"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Stream content:// file import into the P-AI Android sandbox workspace."
license = "Apache-2.0 OR MIT"

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-linux-android",
]

[lib]
name = "tauri_plugin_workspace_io"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
tauri-plugin = { version = "2" }
thiserror = "2"