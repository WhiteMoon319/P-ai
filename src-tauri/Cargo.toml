[package]
name = "easy-call-ai"
version = "0.74.3"
edition = "2021"
description = "P-ai desktop app"
default-run = "p-ai"
autobins = false

[[bin]]
name = "p-ai"
path = "src/main.rs"

[lib]
name = "easy_call_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chardetng = "1.0.0"
encoding_rs = "0.8"
toml = "1.1.2"
serde_yaml = "0.9"
directories = "6.0.0"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = { path = "vendor/tauri-plugin-notification" }
tauri-plugin-workspace-io = { path = "vendor/tauri-plugin-workspace-io" }
tauri-plugin-device-control = { path = "vendor/tauri-plugin-device-control" }
time = { version = "0.3.53", features = ["local-offset"] }
rmcp = { version = "3.0.1", features = ["client", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "multipart", "query", "form", "rustls"] }
webpki-root-certs = "1"
genai = { git = "https://github.com/jeremychone/rust-genai.git", rev = "bd84fbb10321536d2543e790d912befb835901b6" }
base64 = "0.22"
zstd = "0.13"
aes = "0.9.1"
md5 = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
infer = "0.19.0"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
scraper = "0.27.0"
rs-trafilatura = "0.2"
urlencoding = "2.1"
futures-util = "0.3"
socket2 = "0.6.4"
os_info = "3"
sse-stream = "0.2"
sha2 = "0.11.0"
flate2 = "1.1"
tar = "0.4"
pdf_oxide = { version = "0.3.70", default-features = false }
hayro = "0.7.1"
aho-corasick = "1.1"
webp = "0.3"
rayon = "1.10"
tiktoken-rs = "0.12.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
parking_lot = "0.12"
tantivy = "0.26.0"
chrono = { version = "0.4", features = ["serde"] }
undoc = "0.5.2"
litchi = { git = "https://github.com/DevExzh/litchi.git", rev = "5a931961d58bf71c6bb5b7e82f450bda34349e3d" }
walkdir = "2.5.0"
regex = "1.12.4"
zip = { version = "8.5.1", default-features = false, features = ["deflate", "aes-crypto"] }
ropey = "1.6.1"
unicode-segmentation = "1.13.3"
notify = "7"
notify-debouncer-mini = "0.5"
gix-ignore = "0.22"
bstr = "1"

# 桌面专属依赖（Android 构建时排除）
[target.'cfg(not(target_os = "android"))'.dependencies]
# hickory-dns 纯 Rust 解析器依赖 /etc/resolv.conf，Android 上无此文件会导致 DNS 解析卡死；
# 仅桌面启用，Android 退回系统默认 getaddrinfo 解析器。
reqwest = { version = "0.13.4", default-features = false, features = ["hickory-dns"] }
# dingtalk-stream 依赖 tokio-tungstenite 0.28（默认 native-tls），会拉入 openssl-sys；
# Android 交叉编译无法链接 OpenSSL，且 lib.rs 已用 dingtalk_stream_android_stub 提供同接口空实现。
dingtalk-stream = "0.1.5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
arboard = "3"
font-kit = "0.14"
webbrowser = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = true

[profile.test.package."*"]
debug = 0

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
strip = true
debug = false

[dev-dependencies]
httpmock = "0.8.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"
users = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
users = "0.11"

[workspace]
