[package]
name = "pai-android-platform"
version.workspace = true
edition.workspace = true
description = "P-AI Android 平台能力（workspace/rootfs/proot/TLS/沙盒）"

[dependencies]
pai-backend = { path = "../pai-backend" }
aes = "0.9.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
infer = "0.19.0"
md5 = "0.8"
once_cell = "1"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rmcp = { version = "3.0.1", features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
sse-stream = "0.2"
tiktoken-rs = "0.6"
time = { version = "0.3.53", features = ["local-offset"] }
toml = "1.1.2"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
urlencoding = "2.1"
uuid = { version = "1", features = ["v4"] }
webpki-root-certs = "1"
