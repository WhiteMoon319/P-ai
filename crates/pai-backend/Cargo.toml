[package]
name = "pai-backend"
version.workspace = true
edition.workspace = true
description = "P-AI 平台无关业务后端（会话/消息/记忆/任务/远程IM/配置/migration）"

[dependencies]
pai-protocol = { path = "../pai-protocol" }
aho-corasick = "1.1"
chardetng = "1.0.0"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
genai = { git = "https://github.com/jeremychone/rust-genai.git", rev = "cf3396e3ac9c6bf74be5a9ed4c2400ff920f29e7" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.0.1", features = ["macros"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
schemars = "1.2.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
tantivy = "0.26.0"
tokio = { workspace = true }
time = { version = "0.3.53", features = ["local-offset", "formatting", "parsing"] }
toml = "1.1.2"
unicode-segmentation = "1.13.3"
uuid = { version = "1", features = ["v4"] }
webp = "0.3"
webpki-root-certs = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }
