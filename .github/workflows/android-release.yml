name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Enable cleartext traffic for WebView WebSocket
        run: |
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/g' "$GRADLE"
          echo "Updated $GRADLE:"
          grep -n 'usesCleartextTraffic' "$GRADLE" || true

      - name: Inject git-based version
        run: bash scripts/patch-android-version.sh

      - name: Copy Android app icons
        run: |
          if [ -d "src-tauri/icons/android" ]; then
            # 移除 tauri android init 生成的模板自适应图标（引用模板 foreground），
            # 让 Android 8+ 直接使用 mipmap-*/ic_launcher.png（PAI legacy 图标）
            rm -rf src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
            echo "Custom icons copied to Android res/"
            ls src-tauri/gen/android/app/src/main/res/mipmap-hdpi/ic_launcher.png || echo "WARNING: icon not found"
          else
            echo "No custom Android icons found"
          fi

      - name: Patch Android microphone permissions and safe area
        run: bash scripts/patch-android-project.sh

      - name: Download proot native libs (arm64)
        run: |
          JNI_DIR="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
          # 从 Termux 官方包仓库下载 proot 及宿主侧动态依赖
          # 动态解析目录页最新 *_aarch64.deb，避免上游更新版本号导致硬编码 URL 404
          PROOT_DEB=$(curl -fsSL "https://packages.termux.dev/apt/termux-main/pool/main/p/proot/" | grep -oE 'proot_[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+_aarch64\.deb' | sort -V | tail -1)
          TALLOC_DEB=$(curl -fsSL "https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/" | grep -oE 'libtalloc_[0-9]+\.[0-9]+\.[0-9]+_aarch64\.deb' | sort -V | tail -1)
          SHMEM_DEB=$(curl -fsSL "https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/" | grep -oE 'libandroid-shmem_[0-9]+\.[0-9]+_aarch64\.deb' | sort -V | tail -1)
          [ -n "$PROOT_DEB" ] && [ -n "$TALLOC_DEB" ] && [ -n "$SHMEM_DEB" ] || { echo "ERROR: failed to resolve latest Termux deb" >&2; exit 1; }
          PROOT_URL="https://packages.termux.dev/apt/termux-main/pool/main/p/proot/${PROOT_DEB}"
          TALLOC_URL="https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/${TALLOC_DEB}"
          SHMEM_URL="https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/${SHMEM_DEB}"
          for url in "$PROOT_URL" "$TALLOC_URL" "$SHMEM_URL"; do
            name=$(basename "$url")
            curl -fsSL --connect-timeout 30 --retry 3 "$url" -o "/tmp/$name"
            mkdir -p "/tmp/extract-$name"
            ar x "/tmp/$name" --output="/tmp/extract-$name"
            tar -xf "/tmp/extract-$name/data.tar.xz" -C "/tmp/extract-$name"
          done
          # proot 二进制（exec + loader，loader 缺失时 guest execve 无法初始化）。
          cp /tmp/extract-${PROOT_DEB}/data/data/com.termux/files/usr/bin/proot "$JNI_DIR/libproot_exec.so"
          chmod +x "$JNI_DIR/libproot_exec.so"
          LOADER_SRC="/tmp/extract-${PROOT_DEB}/data/data/com.termux/files/usr/libexec/proot/loader"
          if [ ! -f "$LOADER_SRC" ]; then
            LOADER_SRC="/tmp/extract-${PROOT_DEB}/data/data/com.termux/files/usr/lib/libproot_loader.so"
          fi
          if [ -f "$LOADER_SRC" ]; then
            cp "$LOADER_SRC" "$JNI_DIR/libproot_loader.so"
            chmod 0644 "$JNI_DIR/libproot_loader.so"
          else
            echo "ERROR: libproot_loader.so not found in proot deb" >&2
            exit 1
          fi
          cp /tmp/extract-${TALLOC_DEB}/data/data/com.termux/files/usr/lib/libtalloc.so.2 "$JNI_DIR/libtalloc.so"
          chmod 0644 "$JNI_DIR/libtalloc.so"
          patchelf --set-soname libtalloc.so "$JNI_DIR/libtalloc.so" || true
          cp /tmp/extract-${SHMEM_DEB}/data/data/com.termux/files/usr/lib/libandroid-shmem.so "$JNI_DIR/libandroid-shmem.so"
          chmod 0644 "$JNI_DIR/libandroid-shmem.so"
          if patchelf --print-needed "$JNI_DIR/libproot_exec.so" | grep -qx 'libtalloc.so.2'; then
            patchelf --replace-needed libtalloc.so.2 libtalloc.so "$JNI_DIR/libproot_exec.so"
          fi
          patchelf --set-rpath '$ORIGIN' "$JNI_DIR/libproot_exec.so"
          echo "proot rpath: $(patchelf --print-rpath "$JNI_DIR/libproot_exec.so")"
          echo "jniLibs: $(ls -lh "$JNI_DIR")"
          echo "proot deps: $(patchelf --print-needed "$JNI_DIR/libproot_exec.so")"
          rm -rf /tmp/proot_*.deb /tmp/libtalloc_*.deb /tmp/libandroid-shmem_*.deb /tmp/extract-*

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/release.jks"

      - name: Build Release APK (aarch64)
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK with release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          ls -la "$APK_DIR"
          for apk in "$APK_DIR"/*-unsigned.apk; do
            [ -e "$apk" ] || { echo "No unsigned APK found in $APK_DIR" >&2; exit 1; }
            signed="${apk/-unsigned/-signed}"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "pass:${KEYSTORE_PASSWORD}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASSWORD}" \
              --out "$signed" "$apk"
          done
          ls -la "$APK_DIR"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          for apk in "$APK_DIR"/*-signed.apk; do
            "$BUILD_TOOLS/apksigner" verify "$apk"
          done

      - name: Rename signed APK
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/release"
          TAG="${GITHUB_REF_NAME:-dev}"
          for apk in "$APK_DIR"/*-signed.apk; do
            mv "$apk" "$APK_DIR/P-ai-${TAG}-aarch64.apk"
            echo "Renamed to P-ai-${TAG}-aarch64.apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: p-ai-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: p-ai-android-release
          path: release-apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/*.apk
          generate_release_notes: true
