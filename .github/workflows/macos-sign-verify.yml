name: macOS Signing Verify

# 仅供验证 macOS 代码签名链路：把自签名证书导入 CI 的临时 keychain 并设为可信根，
# 构建一次 .app，输出 codesign 的 designated requirement 与 identifier。
# 不创建 Release、不上传产物，可与正式发布流程并存。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify macOS code signing
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 自签名证书默认不受信任，会被 Tauri 的身份解析过滤掉，报
      # "failed to resolve signing identity"。这里自己管 keychain、把证书设为可信根，
      # 再让 Tauri 直接按证书名签名。
      - name: Set up self-signed signing keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::error::APPLE_CERTIFICATE secret 未设置"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/pai-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_P12="$RUNNER_TEMP/pai-signing.p12"
          CERT_PEM="$RUNNER_TEMP/pai-signing.pem"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_P12" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"

          security find-certificate -c "PAI Self-Signed" -p "$KEYCHAIN" > "$CERT_PEM"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$CERT_PEM"

          echo "=== 设为可信根后的有效签名身份 ==="
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "PAI Self-Signed"; then
            echo "::error::证书设为可信根后仍不是有效签名身份"
            exit 1
          fi
          rm -f "$CERT_P12"

      - name: Build signed macOS app
        env:
          APPLE_SIGNING_IDENTITY: "PAI Self-Signed"
        run: |
          set -euo pipefail
          pnpm exec tauri build --target universal-apple-darwin --bundles app \
            --config src-tauri/tauri.macos.conf.json \
            --config src-tauri/tauri.no-updater.conf.json

      - name: Inspect produced signature
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::未找到构建产物 .app"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "=== codesign -dv ==="
          codesign -dv --verbose=4 "$APP" 2>&1 || true

          echo "=== designated requirement ==="
          codesign -d -r- "$APP" 2>&1 || true

          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true

          echo "=== 内嵌 CFBundleIdentifier ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist" 2>&1 || true

      - name: Smoke launch
        run: |
          set -euo pipefail
          APP="${APP:?APP 未设置}"
          open "$APP" || true
          sleep 8
          if pgrep -f "$APP/Contents/MacOS/" > /dev/null; then
            echo "[ok] app 启动成功"
          else
            echo "::warning::app 未在 8 秒内启动，需人工确认是否受 hardened runtime 影响"
          fi
          pkill -f "$APP/Contents/MacOS/" || true
