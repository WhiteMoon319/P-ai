name: Android Build - Kotlin Compose (feat/android-kotlin-ui)

# 专门验证 feat/android-kotlin-ui 分支的原生 Kotlin + Compose 前端能否编译出 APK。
# gen/android 已入库（含自定义 Kotlin 源码与 build.gradle 依赖），本 workflow 复刻
# dev 的 android-build 主链路并聚焦验证该分支工程可编译，供 CI 返回编译结果。

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-kotlin-ui

jobs:
  build-android-kotlin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # gen/android 已入库。init --ci 为增量补全，补生成被 gitignore 的 tauri 动态构建
      # 文件（tauri.settings.gradle / tauri.build.gradle.kts），不会覆盖已入库的自定义
      # Kotlin 源码与 app/build.gradle.kts（Compose 依赖配置）。
      - name: Initialize Android project (incremental)
        run: pnpm tauri android init --ci

      - name: Enable cleartext traffic for WebView WebSocket
        run: |
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/g' "$GRADLE"
          # proot 库必须解压到 nativeLibraryDir（extractNativeLibs=false 时 so 留在 APK 内，
          # Rust 后端 /proc/self/maps 扫描不到，exec 报"未找到 libproot_exec.so"）
          if ! grep -q 'useLegacyPackaging' "$GRADLE"; then
            sed -i 's/jniLibs.keepDebugSymbols.add("\*\/x86_64\/\*\.so")/jniLibs.keepDebugSymbols.add("*\/x86_64\/*.so")\n                jniLibs.useLegacyPackaging = true/g' "$GRADLE"
          fi
          echo "Updated $GRADLE:"
          grep -nE 'usesCleartextTraffic|useLegacyPackaging' "$GRADLE" || true

      - name: Inject git-based version
        run: bash scripts/patch-android-version.sh

      - name: Patch Android microphone permissions and safe area
        run: bash scripts/patch-android-project.sh

      - name: Download proot native libs (arm64)
        run: |
          JNI_DIR="src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_DIR"
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
          # 从 Termux 官方包仓库下载 proot 及宿主侧动态依赖
          PROOT_URL="https://packages.termux.dev/apt/termux-main/pool/main/p/proot/proot_5.1.107.89_aarch64.deb"
          TALLOC_URL="https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.4.3_aarch64.deb"
          SHMEM_URL="https://packages.termux.dev/apt/termux-main/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"
          for url in "$PROOT_URL" "$TALLOC_URL" "$SHMEM_URL"; do
            name=$(basename "$url")
            curl -fsSL --connect-timeout 30 --retry 3 "$url" -o "/tmp/$name"
            mkdir -p "/tmp/extract-$name"
            ar x "/tmp/$name" --output="/tmp/extract-$name"
            tar -xf "/tmp/extract-$name/data.tar.xz" -C "/tmp/extract-$name"
          done
          # proot 二进制（exec + loader，loader 缺失时 guest execve 无法初始化）。
          # Termux 包中 loader 位于 usr/libexec/proot/loader，按 libproot_loader.so 命名打包。
          cp /tmp/extract-proot_5.1.107.89_aarch64.deb/data/data/com.termux/files/usr/bin/proot "$JNI_DIR/libproot_exec.so"
          chmod +x "$JNI_DIR/libproot_exec.so"
          LOADER_SRC="/tmp/extract-proot_5.1.107.89_aarch64.deb/data/data/com.termux/files/usr/libexec/proot/loader"
          if [ ! -f "$LOADER_SRC" ]; then
            LOADER_SRC="/tmp/extract-proot_5.1.107.89_aarch64.deb/data/data/com.termux/files/usr/lib/libproot_loader.so"
          fi
          if [ -f "$LOADER_SRC" ]; then
            cp "$LOADER_SRC" "$JNI_DIR/libproot_loader.so"
            chmod 0644 "$JNI_DIR/libproot_loader.so"
          else
            echo "ERROR: libproot_loader.so not found in proot deb (checked usr/libexec/proot/loader and usr/lib); proot guest execve will fail" >&2
            exit 1
          fi
          # Android native libs 只稳定打包 lib*.so；把 Termux 的 libtalloc.so.2 改名并同步修补 NEEDED。
          cp /tmp/extract-libtalloc_2.4.3_aarch64.deb/data/data/com.termux/files/usr/lib/libtalloc.so.2 "$JNI_DIR/libtalloc.so"
          chmod 0644 "$JNI_DIR/libtalloc.so"
          patchelf --set-soname libtalloc.so "$JNI_DIR/libtalloc.so" || true
          cp /tmp/extract-libandroid-shmem_0.7_aarch64.deb/data/data/com.termux/files/usr/lib/libandroid-shmem.so "$JNI_DIR/libandroid-shmem.so"
          chmod 0644 "$JNI_DIR/libandroid-shmem.so"
          if patchelf --print-needed "$JNI_DIR/libproot_exec.so" | grep -qx 'libtalloc.so.2'; then
            patchelf --replace-needed libtalloc.so.2 libtalloc.so "$JNI_DIR/libproot_exec.so"
          fi
          # 设置 rpath: Android bionic linker 只识别 DT_RUNPATH，旧式 DT_RPATH 会被忽略并
          # 在每次加载时打 "unused DT entry: DT_RPATH" 警告；patchelf 默认写 DT_RUNPATH，
          # $ORIGIN 让动态库在同目录解析（bionic 支持 DT_RUNPATH 中的 $ORIGIN）。
          patchelf --set-rpath '$ORIGIN' "$JNI_DIR/libproot_exec.so"
          echo "proot rpath: $(patchelf --print-rpath "$JNI_DIR/libproot_exec.so")"
          echo "jniLibs: $(ls -lh "$JNI_DIR")"
          echo "proot info: $(file "$JNI_DIR/libproot_exec.so")"
          echo "proot deps: $(patchelf --print-needed "$JNI_DIR/libproot_exec.so")"
          rm -rf /tmp/proot_*.deb /tmp/libtalloc_*.deb /tmp/libandroid-shmem_*.deb /tmp/extract-*

      # 诊断：确认 init 后 build.gradle.kts 的 compose 配置未被覆盖
      - name: Diagnose compose config
        run: |
          echo "===== build.gradle.kts compose 配置（CI 实际状态）====="
          grep -nE "compose|kotlinCompiler|material3|icons|runtime|compilerExtension" src-tauri/gen/android/app/build.gradle.kts || echo "!! 未找到 compose 配置，可能被 init 覆盖 !!"

      - name: Build Debug APK (aarch64)
        run: pnpm tauri android build --apk --target aarch64 --debug || true

      # tauri-build 已生成 tauri.settings.gradle / tauri.build.gradle.kts 后，才能独立跑 gradle
      - name: Diagnose resolved Compose dependency tree
        if: always()
        run: |
          echo "===== 实际解析的 compose 依赖版本（真实依赖树）====="
          (cd src-tauri/gen/android && bash gradlew :app:dependencies --configuration universalDebugRuntimeClasspath --console=plain 2>&1 | grep -iE "compose|com\.squareup|lifecycle|activity" | head -60) || true
          echo "===== 是否存在多个 runtime 版本冲突 ====="
          (cd src-tauri/gen/android && bash gradlew :app:dependencies --configuration universalDebugRuntimeClasspath --console=plain 2>&1 | grep -iE "compose.*runtime|runtime.*compose|FAILED|Conflict") || true

      - name: Rename debug APK
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/debug"
          ls -la "$APK_DIR"
          # 分支名可能含 /（如 feat/android-kotlin-ui），替换成 - 避免当路径
          TAG="${GITHUB_REF_NAME:-kotlin-ui}"
          TAG="${TAG//\//-}"
          for apk in "$APK_DIR"/*.apk; do
            [ -e "$apk" ] || { echo "No APK found in $APK_DIR" >&2; exit 1; }
            mv "$apk" "$APK_DIR/P-ai-${TAG}-aarch64.apk"
            echo "Renamed to P-ai-${TAG}-aarch64.apk"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: p-ai-android-kotlin-ui
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error